name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Quality (test + typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Renderer tests
        run: pnpm --filter @cookietodo/renderer test
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Biome lint
        run: npx biome check .
      - name: Web build
        run: pnpm --filter @cookietodo/renderer build
      - name: Electron main build
        run: pnpm --filter @cookietodo/electron build:main

  release-linux:
    name: Release (Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Linux packages
        run: pnpm --filter @cookietodo/electron package
      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            apps/electron/release/cookietodo-*.AppImage \
            apps/electron/release/cookietodo-*.deb \
            --clobber

  release-win:
    name: Release (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & package
        run: pnpm --filter @cookietodo/electron package:win
      - name: Upload Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            apps/electron/release/cookietodo-*.exe \
            apps/electron/release/cookietodo-*.zip \
            --clobber

  release-android:
    name: Release (Android APK)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Build web + sync
        run: |
          pnpm --filter @cookietodo/renderer build
          npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber