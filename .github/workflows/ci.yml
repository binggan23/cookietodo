name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Quality (test + typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Renderer tests
        run: pnpm --filter @cookietodo/renderer test

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Biome lint
        run: npx biome check .

      - name: Web build
        run: pnpm --filter @cookietodo/renderer build

      - name: Electron main build
        run: pnpm --filter @cookietodo/electron build:main

  release:
    name: Release (AppImage + deb)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @cookietodo/electron package

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            apps/electron/release/cookietodo-*.AppImage \
            apps/electron/release/cookietodo-*.deb \
            --clobber