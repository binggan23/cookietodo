name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  quality:
    name: Quality (test + typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Renderer tests
        run: pnpm --filter @cookietodo/renderer test

      - name: TypeScript typecheck (renderer + electron)
        run: pnpm --filter @cookietodo/renderer typecheck && pnpm --filter @cookietodo/electron typecheck

      - name: Biome lint
        run: npx biome check .

      - name: Web build
        run: pnpm --filter @cookietodo/renderer build

      - name: Electron main build
        run: pnpm --filter @cookietodo/electron build:main

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @cookietodo/renderer build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}